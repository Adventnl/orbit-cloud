# Orbit-Cloud Infrastructure Host Inventory

# Target control-plane / hyperconverged nodes
[k8s_nodes]
orbit-control-01 ansible_host=192.168.56.11
orbit-control-02 ansible_host=192.168.56.12
orbit-control-03 ansible_host=192.168.56.13

# Host groups for targeted playbook executions
[masters]
orbit-control-01
orbit-control-02
orbit-control-03

[workers]
# Hyperconverged deployment: Master nodes will double as workers.
# Add separate worker nodes here if scaling the cluster later.

# Infrastructure Global Variables
[all:vars]
# Default username for the VM box
ansible_user=vagrant

# Vagrant dynamically writes individual SSH private keys for security.
# This variable resolves the key file relative to the inventory location.
ansible_ssh_private_key_file=../vagrant/.vagrant/machines/{{ inventory_hostname }}/virtualbox/private_key

# Prevent validation prompts during dynamic provisioning
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# --- REAL BARE-METAL/VM PRODUCTION OVERRIDE EXAMPLE ---
# If deploying to real machines, replace the variables above with your remote targets:
# ansible_user=ubuntu
# ansible_ssh_private_key_file=~/.ssh/id_rsa
# ansible_ssh_common_args='-o StrictHostKeyChecking=no'
