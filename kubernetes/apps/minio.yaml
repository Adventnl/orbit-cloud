apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: minio
type: Opaque
stringData:
  # Root admin access credentials for S3 API / Console
  MINIO_ROOT_USER: admin
  MINIO_ROOT_PASSWORD: orbitcloudadminsecret
---
apiVersion: v1
kind: Service
metadata:
  name: minio-lb
  namespace: minio
  annotations:
    # MetalLB will automatically assign an external IP from the pool to this service
    metallb.universe.tf/allow-shared-ip: "minio-shared"
spec:
  type: LoadBalancer
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: minio
spec:
  serviceName: minio
  replicas: 3
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # Use host network to bypass CNI overhead and bind directly to node interfaces
      hostNetwork: true
      
      # Use local dnsPolicy when hostNetwork is true to resolve internal service names
      dnsPolicy: ClusterFirstWithHostNet
      
      # Anti-affinity ensures that pods are scheduled exactly one per node
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - minio
              topologyKey: "kubernetes.io/hostname"
      
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-05-10T01-39-08Z
          command:
            - minio
            - server
            - http://orbit-control-01/data/1
            - http://orbit-control-01/data/2
            - http://orbit-control-02/data/1
            - http://orbit-control-02/data/2
            - http://orbit-control-03/data/1
            - http://orbit-control-03/data/2
            - --console-address
            - :9001
          envFrom:
            - secretRef:
                name: minio-creds
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          # Volume mounts map to container storage
          volumeMounts:
            - name: disk1
              mountPath: /data/1
            - name: disk2
              mountPath: /data/2
      
      # Maps raw local node disk mounts
      volumes:
        - name: disk1
          hostPath:
            path: /mnt/data/1
            type: DirectoryOrCreate
        - name: disk2
          hostPath:
            path: /mnt/data/2
            type: DirectoryOrCreate
