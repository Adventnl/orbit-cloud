apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: orbit-ip-pool
  namespace: kube-system
spec:
  # The pool of IP addresses allocated for LoadBalancer services.
  # These act as AWS Elastic IPs inside our private backplane subnet.
  addresses:
  - 192.168.56.200-192.168.56.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: orbit-l2-advertisement
  namespace: kube-system
spec:
  # Tells MetalLB to use Layer 2 ARP to advertise these IP addresses to the local network.
  ipAddressPools:
  - orbit-ip-pool
